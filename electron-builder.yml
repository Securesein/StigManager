appId: com.stigmanager.app
productName: STIG Manager
copyright: MIT

directories:
  output: release

files:
  - main/**
  - shared/**
  - dist/**
  - package.json

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
